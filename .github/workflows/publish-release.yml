name: Publish Foundry Module

on:
  push:
    branches: [main]
    paths:
      - module.json
      - scripts/**
      - styles/**
      - icons/**
      - tests/**
      - patches/**
      - PLAYER-BASIC-ACTIONS-LAUNCHER.js
      - PLAYER-MAGICK-LAUNCHER.js
      - ICONS-CREDITS.md
      - tools/package_release.py
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged v0.1.21 runtime
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          if [[ "$version" == "0.1.21" ]]; then
            test "$(sha256sum scripts/player-actions.js | cut -d' ' -f1)" = "60e66c3bd7b0408be904b76de21725805b72c61ac100f6a1c81b4c073338e95e"
          fi
      - name: Verify JavaScript and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/player-actions.js
          for test in tests/*.cjs; do node "$test"; done
      - name: Package versioned Foundry release
        shell: bash
        run: python3 tools/package_release.py
      - name: Commit verified runtime source to main
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- scripts/player-actions.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/player-actions.js
            git commit -m 'build: commit verified v0.1.21 Player Magick runtime'
            git push origin HEAD:main
          fi
      - name: Publish GitHub Release with installable ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          tag="v${version}"
          zip="dist/wod20-player-magick-${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving versioned asset unchanged."
          else
            gh release create "$tag" "$zip" \
              --target "$(git rev-parse HEAD)" \
              --title "WoD20 Player Magick & Actions $tag" \
              --notes-file RELEASE-NOTES.md
          fi
