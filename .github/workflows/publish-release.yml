name: Publish Foundry Module

on:
  push:
    branches: [main]
    paths:
      - module.json
      - scripts/**
      - styles/**
      - icons/**
      - tests/**
      - PLAYER-BASIC-ACTIONS-LAUNCHER.js
      - PLAYER-MAGICK-LAUNCHER.js
      - ICONS-CREDITS.md
      - tools/package_release.py
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/player-actions.js
          for test in tests/*.cjs; do node "$test"; done
      - name: Package versioned Foundry release
        shell: bash
        run: python3 tools/package_release.py
      - name: Publish GitHub Release with installable ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          tag="v${version}"
          zip="dist/wod20-player-magick-${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving versioned asset unchanged."
          else
            gh release create "$tag" "$zip" \
              --target "$GITHUB_SHA" \
              --title "WoD20 Player Actions $tag" \
              --notes "WoD20 Player Actions: GM-provisioned player-readable world Macro compendium with 39 draggable shortcuts (20 Basic Actions, five custom slots, Dodge, Attack, Initiative, Magick, Rotes, dashboards). No automatic hotbar assignments; native WoD20 dice, wound, specialty and Paradox contracts preserved. The world compendium persists after code rollback. Back up world and module before upgrading. Automated tests passed; live Foundry v14 drag-and-roll verification pending."
          fi
